<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B. Living - Dia das Mães Corretores</title>
    <style>
      :root {
        --navy: #101d2a;
        --night: #07101a;
        --paper: #e9dfcc;
        --paper-soft: #d8c8ad;
        --paper-dim: #b9aa91;
        --brass: #cfb28a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #101010;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .story {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 83% 18%, rgba(207, 178, 138, 0.1), transparent 24%),
          linear-gradient(142deg, #07101a 0%, #0c1824 42%, #101d2a 100%);
        color: var(--paper);
      }

      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        background-image:
          repeating-linear-gradient(0deg, rgba(233, 223, 204, 0.035) 0 1px, transparent 1px 5px),
          repeating-linear-gradient(90deg, rgba(233, 223, 204, 0.025) 0 1px, transparent 1px 7px);
        mix-blend-mode: screen;
        z-index: 1;
      }

      .wall-light {
        position: absolute;
        right: -110px;
        top: 0;
        width: 430px;
        height: 1920px;
        background:
          linear-gradient(90deg, transparent, rgba(207, 178, 138, 0.09), transparent),
          linear-gradient(180deg, rgba(233, 223, 204, 0.05), transparent 34%, rgba(0, 0, 0, 0.28));
        transform: skewX(-9deg);
        z-index: 1;
      }

      .map {
        position: absolute;
        right: 58px;
        top: 635px;
        width: 360px;
        height: 480px;
        opacity: 0.17;
        filter: grayscale(1) sepia(0.35) saturate(0.8);
        z-index: 2;
      }

      .rule-top {
        position: absolute;
        top: 112px;
        left: 94px;
        width: 240px;
        height: 1px;
        background: var(--brass);
        opacity: 0.72;
        z-index: 4;
      }

      .rule-side {
        position: absolute;
        top: 112px;
        right: 86px;
        width: 1px;
        height: 1480px;
        background: linear-gradient(180deg, var(--brass), transparent 88%);
        opacity: 0.58;
        z-index: 4;
      }

      .brand {
        position: absolute;
        top: 92px;
        right: 108px;
        width: 46px;
        z-index: 5;
      }

      .content {
        position: absolute;
        left: 94px;
        right: 128px;
        top: 276px;
        z-index: 5;
      }

      .label {
        margin: 0 0 92px;
        color: var(--brass);
        font-size: 22px;
        letter-spacing: 0.22em;
        line-height: 1;
        text-transform: uppercase;
      }

      h1 {
        width: 790px;
        margin: 0;
        color: var(--paper);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 116px;
        line-height: 0.92;
        font-weight: 400;
        letter-spacing: 0;
        text-transform: uppercase;
        text-shadow: 0 16px 28px rgba(0, 0, 0, 0.22);
      }

      .message {
        width: 635px;
        margin: 72px 0 0;
        color: var(--paper-soft);
        font-size: 34px;
        line-height: 1.42;
        font-weight: 300;
      }

      .signature {
        position: absolute;
        left: 94px;
        bottom: 128px;
        z-index: 5;
        color: var(--paper);
      }

      .signature::before {
        content: "";
        display: block;
        width: 86px;
        height: 1px;
        margin-bottom: 34px;
        background: var(--brass);
        opacity: 0.86;
      }

      .warm {
        margin: 0 0 14px;
        color: var(--paper-dim);
        font-size: 27px;
        line-height: 1;
        font-weight: 300;
      }

      .name {
        margin: 0;
        color: var(--paper);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 43px;
        line-height: 1.05;
        font-weight: 400;
      }

      .brand-note {
        position: absolute;
        right: 106px;
        bottom: 130px;
        z-index: 5;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        color: rgba(207, 178, 138, 0.52);
        font-size: 16px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <section class="story" id="story-marta-tretto">
      <div class="grain"></div>
      <div class="wall-light"></div>
      <img class="map" src="assets/florianopolis-ibge-map.svg" alt="" />
      <div class="rule-top"></div>
      <div class="rule-side"></div>
      <img class="brand" src="assets/icone-b-brass.png" alt="B. Living" />
      <main class="content">
        <p class="label">B. Living</p>
        <h1>Feliz dia das mães.</h1>
        <p class="message">Que hoje seja um dia para reconhecer quem transforma casa em cuidado, rotina em memória e presença em lar.</p>
      </main>
      <footer class="signature">
        <p class="warm">Com carinho,</p>
        <p class="name">Marta Tretto</p>
      </footer>
      <div class="brand-note">Curadoria imobiliária</div>
    </section>
  </body>
</html>
