<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenhando Coração - Browser Use</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #fff8fa;
      color: #251018;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(92vw, 900px);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      letter-spacing: 0;
    }

    canvas {
      width: 760px;
      max-width: 100%;
      height: 560px;
      background: #ffffff;
      border: 2px solid #ffd0dc;
      border-radius: 8px;
      box-shadow: 0 22px 60px rgba(205, 21, 67, 0.14);
      touch-action: none;
      cursor: crosshair;
    }

    p {
      margin: 14px 0 0;
      color: #764757;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Desenhando o coração pelo movimento do mouse</h1>
    <canvas id="drawing" width="760" height="560" aria-label="Área de desenho"></canvas>
    <p>O traço vermelho aparece conforme o mouse se move.</p>
  </main>

  <script>
    const canvas = document.querySelector("#drawing");
    const ctx = canvas.getContext("2d");
    let drawing = false;
    let previous = null;

    function pointFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height),
      };
    }

    function drawGuide() {
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#ffe2e9";
      ctx.lineWidth = 1;
      for (let x = 40; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 40; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawTo(point) {
      if (!previous) {
        previous = point;
        return;
      }
      ctx.strokeStyle = "#e6003c";
      ctx.lineWidth = 12;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(previous.x, previous.y);
      ctx.lineTo(point.x, point.y);
      ctx.stroke();
      previous = point;
    }

    canvas.addEventListener("pointerdown", (event) => {
      drawing = true;
      previous = pointFromEvent(event);
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!drawing) return;
      drawTo(pointFromEvent(event));
    });

    canvas.addEventListener("pointerup", () => {
      drawing = false;
      previous = null;
    });

    canvas.addEventListener("pointercancel", () => {
      drawing = false;
      previous = null;
    });

    drawGuide();
  </script>
</body>
</html>
