<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B. Living Studio Preview</title>
    <style>
      :root {
        --navy: #101c3d;
        --taupe: #5f554c;
        --sand: #afa69c;
        --beige: #d8cec3;
        --white: #f7f3ec;
        --accent: #cbbbaa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b1228;
        color: var(--white);
        font-family: Georgia, Cambria, serif;
        display: grid;
        grid-template-columns: minmax(360px, 1fr) 360px;
      }
      .stage-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }
      .stage {
        position: relative;
        width: min(56.25vh, 100%);
        aspect-ratio: 9 / 16;
        overflow: hidden;
        background: var(--navy);
        box-shadow: 0 30px 120px rgba(0, 0, 0, 0.48);
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(16, 28, 61, 0.6), rgba(16, 28, 61, 0.95)),
          radial-gradient(circle at 50% 30%, rgba(216, 206, 195, 0.2), transparent 48%);
        z-index: 1;
      }
      .kit {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.11;
        mix-blend-mode: screen;
        z-index: 2;
      }
      .event-video {
        position: absolute;
        left: 7.4%;
        top: 17%;
        width: 85.2%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border: 3px solid rgba(247, 243, 236, 0.72);
        box-shadow: 0 22px 54px rgba(0, 0, 0, 0.34);
        filter: saturate(0.78) contrast(1.05);
        z-index: 4;
      }
      .brand-lockup {
        position: absolute;
        top: 6.2%;
        left: 0;
        width: 100%;
        z-index: 8;
        text-align: center;
        letter-spacing: 0.08em;
      }
      .brand {
        font-size: clamp(30px, 7vw, 55px);
        line-height: 1;
      }
      .rule {
        width: 54%;
        height: 1px;
        margin: 18px auto 15px;
        background: rgba(203, 187, 170, 0.72);
      }
      .eyebrow {
        color: var(--accent);
        font-size: clamp(13px, 2.4vw, 21px);
      }
      .caption-panel {
        position: absolute;
        left: 6.5%;
        bottom: 12.3%;
        width: 87%;
        height: 19.3%;
        background: rgba(16, 28, 61, 0.74);
        border: 1px solid rgba(203, 187, 170, 0.42);
        z-index: 6;
      }
      .cue {
        position: absolute;
        left: 8.9%;
        bottom: 16.6%;
        width: 82.2%;
        min-height: 9.8%;
        z-index: 9;
        text-align: center;
        font-size: clamp(24px, 5.6vw, 47px);
        line-height: 1.08;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.16em;
        transform: translateY(18px);
        opacity: 0;
        transition: opacity 240ms ease, transform 240ms ease;
      }
      .cue.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .accent {
        color: var(--accent);
      }
      .controls {
        border-left: 1px solid rgba(203, 187, 170, 0.22);
        background: rgba(16, 28, 61, 0.98);
        min-height: 100vh;
        padding: 26px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .controls h1 {
        font-size: 24px;
        margin: 0;
        font-weight: 400;
      }
      .meta {
        color: var(--accent);
        font-size: 14px;
        line-height: 1.5;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      button {
        appearance: none;
        border: 1px solid rgba(203, 187, 170, 0.5);
        background: rgba(247, 243, 236, 0.08);
        color: var(--white);
        padding: 12px 14px;
        font-family: Georgia, Cambria, serif;
        font-size: 15px;
        cursor: pointer;
      }
      input[type="range"] {
        width: 100%;
      }
      .cue-list {
        overflow: auto;
        max-height: calc(100vh - 250px);
        border-top: 1px solid rgba(203, 187, 170, 0.2);
      }
      .cue-item {
        padding: 12px 0;
        border-bottom: 1px solid rgba(203, 187, 170, 0.13);
        color: rgba(247, 243, 236, 0.72);
        font-size: 13px;
        line-height: 1.35;
      }
      .cue-item.active {
        color: var(--white);
      }
      @media (max-width: 900px) {
        body {
          grid-template-columns: 1fr;
        }
        .controls {
          min-height: auto;
          border-left: 0;
          border-top: 1px solid rgba(203, 187, 170, 0.22);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage-shell">
      <section class="stage" aria-label="Preview vertical">
        <div class="bg"></div>
        <img class="kit" src="assets/kit-visual-b-living.jpeg" alt="" />
        <video class="event-video" src="assets/source-video.mp4" muted loop playsinline></video>
        <div class="brand-lockup">
          <div class="brand">B. LIVING</div>
          <div class="rule"></div>
          <div class="eyebrow">INAUGURAÇÃO FLORIPA</div>
        </div>
        <div class="caption-panel"></div>
        <div class="cue" id="cue"></div>
      </section>
    </main>
    <aside class="controls">
      <h1>Studio Preview</h1>
      <div class="meta" id="meta">Carregando captions...</div>
      <div class="row">
        <button id="play">Play</button>
        <button id="restart">Restart</button>
      </div>
      <input id="timeline" type="range" min="0" max="276" value="0" step="0.01" />
      <audio id="audio" src="assets/audio-inauguracao.mp3"></audio>
      <div class="cue-list" id="cue-list"></div>
    </aside>
    <script>
      const highlightTerms = [
        "B. Living",
        "Believe",
        "Florianópolis",
        "Floripa",
        "inauguração",
        "nascimento",
        "nova fase",
        "mercado",
        "sofisticada",
        "integrada",
        "impacto",
        "valor raro",
        "evolução",
        "confiança",
        "família",
        "negócios",
        "cliente",
        "método",
        "Rafael",
        "prosperidade",
        "parceiros",
      ];
      const cueEl = document.getElementById("cue");
      const audio = document.getElementById("audio");
      const video = document.querySelector(".event-video");
      const play = document.getElementById("play");
      const restart = document.getElementById("restart");
      const timeline = document.getElementById("timeline");
      const meta = document.getElementById("meta");
      const cueList = document.getElementById("cue-list");
      let cues = [];
      let activeIndex = -1;

      function escapeHtml(text) {
        return text.replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        })[char]);
      }

      function highlight(text) {
        let html = escapeHtml(text);
        for (const term of highlightTerms) {
          html = html.replace(new RegExp(`(${term.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&")})`, "gi"), '<span class="accent">$1</span>');
        }
        return html;
      }

      function renderCue(cue) {
        if (!cue) {
          cueEl.classList.remove("is-visible");
          return;
        }
        cueEl.innerHTML = cue.lines.map((line) => `<span>${highlight(line)}</span>`).join("");
        cueEl.classList.add("is-visible");
      }

      function sync() {
        const t = audio.currentTime;
        timeline.value = t;
        video.playbackRate = 1;
        const cue = cues.find((item) => t >= item.start && t <= item.end);
        const nextIndex = cue ? cue.index : -1;
        if (nextIndex !== activeIndex) {
          activeIndex = nextIndex;
          renderCue(cue);
          document.querySelectorAll(".cue-item").forEach((item) => {
            item.classList.toggle("active", Number(item.dataset.index) === activeIndex);
          });
        }
        requestAnimationFrame(sync);
      }

      fetch("data/captions.json")
        .then((response) => response.json())
        .then((data) => {
          cues = data.cues;
          timeline.max = data.duration_seconds;
          meta.textContent = `${data.total_screens} telas · ${data.duration_seconds.toFixed(0)}s · ${data.fps}fps`;
          cueList.innerHTML = cues.map((cue) => `<div class="cue-item" data-index="${cue.index}"><strong>${String(cue.index).padStart(3, "0")}</strong> ${cue.text}</div>`).join("");
          sync();
        });

      play.addEventListener("click", async () => {
        if (audio.paused) {
          await Promise.allSettled([audio.play(), video.play()]);
          play.textContent = "Pause";
        } else {
          audio.pause();
          video.pause();
          play.textContent = "Play";
        }
      });
      restart.addEventListener("click", () => {
        audio.currentTime = 0;
        video.currentTime = 0;
      });
      timeline.addEventListener("input", () => {
        audio.currentTime = Number(timeline.value);
        video.currentTime = Number(timeline.value) % 14.282;
      });
    </script>
  </body>
</html>
