<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
  <title id="title">BrandKit Visual da A Última Ideia</title>
  <desc id="desc">Prancha visual com paleta, tipografia, símbolo, texturas e aplicações da marca A Última Ideia.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#090909" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EA" stop-opacity="0.0"/>
      <stop offset="0.45" stop-color="#F7F3EA" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#F7F3EA" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="halftone" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#8A8A84" opacity="0.36"/>
    </pattern>
    <style>
      .bg { fill: #090909; }
      .paper { fill: #F7F3EA; }
      .graphite { fill: #202020; }
      .concrete { fill: #8A8A84; }
      .red { fill: #D71920; }
      .blue { fill: #174BFF; }
      .green { fill: #CFFF00; }
      .yellow { fill: #F6E85A; }
      .line { fill: none; stroke: #F7F3EA; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .line-dark { fill: none; stroke: #090909; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke-width: 1.4; }
      .hair { stroke-width: 0.8; }
      .wordmark { font-family: "Neue Haas Grotesk Display", "Arial", sans-serif; font-size: 104px; font-weight: 800; letter-spacing: 0; fill: #F7F3EA; }
      .display { font-family: "Neue Haas Grotesk Display", "Arial", sans-serif; font-size: 76px; font-weight: 800; letter-spacing: 0; fill: #F7F3EA; }
      .display-dark { font-family: "Neue Haas Grotesk Display", "Arial", sans-serif; font-size: 64px; font-weight: 800; letter-spacing: 0; fill: #090909; }
      .serif { font-family: "Ivar Display", "Georgia", serif; font-size: 44px; font-weight: 500; letter-spacing: 0; fill: #F7F3EA; }
      .serif-dark { font-family: "Ivar Display", "Georgia", serif; font-size: 34px; font-weight: 500; letter-spacing: 0; fill: #090909; }
      .body { font-family: "Suisse Intl", "Arial", sans-serif; font-size: 24px; font-weight: 400; letter-spacing: 0; fill: #F7F3EA; }
      .body-dark { font-family: "Suisse Intl", "Arial", sans-serif; font-size: 22px; font-weight: 400; letter-spacing: 0; fill: #090909; }
      .label { font-family: "Suisse Intl", "Arial", sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; fill: #8A8A84; }
      .label-light { font-family: "Suisse Intl", "Arial", sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; fill: #F7F3EA; }
      .caption { font-family: "Suisse Intl", "Arial", sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 0; fill: #8A8A84; }
      .caption-dark { font-family: "Suisse Intl", "Arial", sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0; fill: #202020; }
      .small { font-family: "Suisse Intl", "Arial", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1px; fill: #8A8A84; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="2000"/>
  <rect width="1600" height="2000" filter="url(#grain)" opacity="0.7"/>
  <path d="M1200 -80 L1710 420 L1395 690 L900 180 Z" fill="url(#light)" opacity="0.65"/>
  <circle cx="1410" cy="164" r="42" class="red"/>
  <line x1="101" y1="116" x2="1499" y2="116" stroke="#202020" stroke-width="2"/>
  <line x1="101" y1="1878" x2="1499" y2="1878" stroke="#202020" stroke-width="2"/>

  <g transform="translate(100 124)">
    <text class="label">BrandKit Visual 01</text>
    <text class="wordmark" y="124">A Última Ideia</text>
    <text class="body" y="176">Direção Criativa e Performance</text>
    <text class="serif" y="260">A última ideia é sempre a mais poderosa.</text>
    <rect x="0" y="296" width="108" height="8" class="red"/>
    <text class="caption" x="0" y="350">Laboratório de Marketing Autoral</text>
    <text class="caption" x="0" y="380">Estratégia, estética, tecnologia e performance para marcas que não querem ser confundidas.</text>
  </g>

  <g transform="translate(1095 154)">
    <rect x="0" y="0" width="360" height="360" rx="0" class="paper" filter="url(#shadow)"/>
    <text class="label" x="42" y="62" fill="#8A8A84">Símbolo</text>
    <g transform="translate(82 93)">
      <path class="line-dark" d="M105 194 C88 164,84 133,93 103"/>
      <path class="line-dark" d="M96 103 C103 68,124 48,144 61 C158 70,158 92,146 109"/>
      <path class="line-dark" d="M145 111 C164 82,192 80,202 97 C211 112,203 132,181 146"/>
      <path class="line-dark" d="M126 127 C148 116,170 122,176 139 C184 160,163 179,134 178"/>
      <path class="line-dark" d="M88 121 C65 108,48 119,47 139 C47 158,65 170,91 171"/>
      <path class="line-dark" d="M92 172 C86 197,95 219,119 227 C145 235,171 225,188 202"/>
      <path class="line-dark thin" d="M218 55 L244 27"/>
      <path class="line-dark thin" d="M230 92 L272 81"/>
      <path class="line-dark thin" d="M205 32 L211 0"/>
      <circle cx="224" cy="54" r="7" class="red"/>
    </g>
    <text class="caption-dark" x="42" y="320">Mão, estalo, autoria, virada.</text>
  </g>

  <g transform="translate(100 560)">
    <text class="label">Paleta</text>
    <g transform="translate(0 38)">
      <rect x="0" y="0" width="170" height="170" fill="#090909" stroke="#F7F3EA" stroke-width="2"/>
      <rect x="190" y="0" width="170" height="170" fill="#F7F3EA"/>
      <rect x="380" y="0" width="170" height="170" fill="#202020"/>
      <rect x="570" y="0" width="170" height="170" fill="#8A8A84"/>
      <rect x="760" y="0" width="170" height="170" fill="#D71920"/>
      <rect x="950" y="0" width="170" height="170" fill="#174BFF"/>
      <rect x="1140" y="0" width="170" height="170" fill="#CFFF00"/>
      <rect x="1330" y="0" width="170" height="170" fill="#F6E85A"/>
      <text class="small" x="18" y="206">#090909</text>
      <text class="small" x="208" y="206">#F7F3EA</text>
      <text class="small" x="398" y="206">#202020</text>
      <text class="small" x="588" y="206">#8A8A84</text>
      <text class="small" x="778" y="206">#D71920</text>
      <text class="small" x="968" y="206">#174BFF</text>
      <text class="small" x="1158" y="206">#CFFF00</text>
      <text class="small" x="1348" y="206">#F6E85A</text>
    </g>
  </g>

  <g transform="translate(100 860)">
    <rect x="0" y="0" width="660" height="420" class="graphite"/>
    <rect x="34" y="34" width="592" height="352" fill="none" stroke="#8A8A84" stroke-width="1"/>
    <text class="label" x="50" y="76">Tipografia</text>
    <text class="display" x="48" y="164">Corte</text>
    <text class="serif" x="50" y="235">Percepção antes de performance.</text>
    <text class="body" x="52" y="302">Sans forte para autoridade. Serif editorial para manifesto. Labels frios para método.</text>
    <rect x="52" y="340" width="96" height="7" class="red"/>
  </g>

  <g transform="translate(810 860)">
    <rect x="0" y="0" width="690" height="420" class="paper"/>
    <rect x="0" y="0" width="690" height="420" fill="url(#halftone)" opacity="0.44"/>
    <text class="label" x="48" y="76">Texturas</text>
    <circle cx="178" cy="214" r="92" fill="#090909"/>
    <ellipse cx="178" cy="214" rx="66" ry="28" fill="#F7F3EA"/>
    <circle cx="178" cy="214" r="20" fill="#090909"/>
    <circle cx="185" cy="206" r="5" fill="#F7F3EA"/>
    <path d="M350 88 L620 352" stroke="#D71920" stroke-width="18"/>
    <rect x="360" y="98" width="210" height="210" fill="none" stroke="#090909" stroke-width="3"/>
    <path d="M384 304 C430 230 458 162 560 116" class="line-dark thin"/>
    <text class="serif-dark" x="48" y="358">Toda peça precisa ter segunda leitura.</text>
  </g>

  <g transform="translate(100 1352)">
    <text class="label">Aplicações</text>
    <g transform="translate(0 48)">
      <rect x="0" y="0" width="300" height="430" class="paper" filter="url(#shadow)"/>
      <rect x="24" y="24" width="252" height="382" fill="#090909"/>
      <text class="label-light" x="45" y="72">Reels Cover</text>
      <text class="display" x="45" y="150" style="font-size:44px">Sua</text>
      <text class="display" x="45" y="203" style="font-size:44px">marca</text>
      <text class="display" x="45" y="256" style="font-size:44px">parece</text>
      <text class="display" x="45" y="309" style="font-size:44px">o que</text>
      <text class="display" x="45" y="362" style="font-size:44px">vale?</text>
      <circle cx="248" cy="357" r="13" class="red"/>
    </g>
    <g transform="translate(350 48)">
      <rect x="0" y="0" width="520" height="300" class="graphite" filter="url(#shadow)"/>
      <text class="label" x="36" y="58">Website Hero</text>
      <text class="display" x="36" y="138" style="font-size:52px">Pare de parecer</text>
      <text class="display" x="36" y="202" style="font-size:52px">comum.</text>
      <rect x="36" y="238" width="178" height="38" class="red"/>
      <text class="label-light" x="55" y="263">Submeta sua ideia</text>
      <path d="M365 20 L520 176 L415 300 L280 138 Z" fill="url(#light)"/>
    </g>
    <g transform="translate(930 48)">
      <rect x="0" y="0" width="570" height="300" class="paper" filter="url(#shadow)"/>
      <text class="label" x="38" y="58">Proposta</text>
      <text class="display-dark" x="38" y="135" style="font-size:46px">Diagnóstico</text>
      <text class="display-dark" x="38" y="192" style="font-size:46px">antes da estética.</text>
      <line x1="38" y1="228" x2="522" y2="228" stroke="#090909" stroke-width="2"/>
      <text class="caption-dark" x="38" y="268">Leitura, construção, propagação, inteligência.</text>
      <circle cx="500" cy="54" r="16" class="red"/>
    </g>
    <g transform="translate(350 388)">
      <rect x="0" y="0" width="340" height="170" class="graphite"/>
      <text class="label" x="30" y="52">Business Card</text>
      <text class="body" x="30" y="96">Gabriel</text>
      <text class="caption" x="30" y="128">Direção Criativa</text>
      <circle cx="292" cy="46" r="9" class="red"/>
    </g>
    <g transform="translate(730 388)">
      <rect x="0" y="0" width="770" height="170" class="paper"/>
      <text class="display-dark" x="32" y="76" style="font-size:40px">Não criamos mais ideias.</text>
      <text class="serif-dark" x="34" y="128">Criamos a última.</text>
      <rect x="646" y="42" width="68" height="68" fill="#D71920"/>
    </g>
  </g>

  <g transform="translate(100 1890)">
    <text class="caption">Regra de uso: 80% neutro, 15% sombra e textura, 5% ruptura. A marca deve criar uma pausa, não implorar atenção.</text>
  </g>
</svg>
